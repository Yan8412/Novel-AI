name: Manual cross-platform verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ""
      NOVEL_AUTH_MODE: local
    steps:
      - name: Checkout source only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit all locked dependencies including development and optional packages
        run: npm run deps:check
      - name: Run isolated mock-model verification
        run: node scripts/verify.mjs
      - name: Install pinned Chromium for isolated browser verification
        run: npm run browser:install
      - name: Run isolated browser clicks without production data
        run: npm run browser:verify
      - name: Check tracked source boundary
        run: node scripts/check-repository.mjs
      # Deliberately no cache/artifact upload and no production credentials.
