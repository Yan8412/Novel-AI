<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>折光故事工坊</title><style>
:root{--i:#20211e;--g:#365d49;--r:#a44a3b;--bg:#f1f0eb;--l:#dddcd4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}.top{height:64px;padding:0 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l)}.brand{font-weight:700}.brand b{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:10px;border-radius:50%;background:var(--i);color:white}.save{max-width:65%;overflow-wrap:anywhere;font-size:11px;color:#777}.hero{padding:42px 5vw 28px;display:flex;justify-content:space-between;align-items:end}.hero small{color:var(--g);letter-spacing:.2em}.hero h1{font:500 clamp(42px,5vw,68px)/1.08 SimSun;margin:12px 0}.hero em{color:var(--r);font-style:normal}.hero p{color:#777}.progress{width:220px;border-top:2px solid;padding-top:10px}.progress b{font:42px Georgia}.bar{height:3px;background:#d3d2cb;margin:10px 0}.bar i{display:block;height:100%;background:var(--g)}main{max-width:1450px;margin:auto}.shell{padding:0 4vw 50px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px}.panel,.work{min-width:0;background:white;border:1px solid #e2e1db;border-radius:16px;box-shadow:0 12px 32px #2028200a}.panel{padding:20px;height:max-content}.panel h2{font:500 20px SimSun;margin:0 0 15px}label{display:block;font-size:10px;color:#666;margin-top:13px}input,select,textarea{width:100%;margin-top:6px;padding:9px;border:1px solid var(--l);border-radius:8px;background:#fafaf7;outline:0;resize:vertical;font-size:11px}.input-note{margin:0 0 8px;padding:9px;background:#f3f6f2;border-radius:8px;color:#66736a;font-size:9px;line-height:1.6}label small{float:right;color:#999;font-weight:400}label strong{float:right;color:var(--r);font-size:9px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lock{width:100%;margin-top:15px;border:1px solid #bdd0c4;background:#e6efe9;color:var(--g);padding:9px;border-radius:8px}.output-box{margin-top:14px;padding:12px;border:1px solid var(--l);border-radius:9px;background:#fafaf7}.output-box span,.output-box small{display:block;color:#888;font-size:8px}.output-box a{display:block;margin:6px 0;color:var(--g);font:600 11px SimSun;text-decoration:none}.output-box a:hover{text-decoration:underline}.tabs{min-width:0;max-width:100%;display:grid;grid-template-columns:repeat(7,minmax(95px,1fr));padding:8px;gap:3px;background:#f8f8f4;border-bottom:1px solid var(--l);overflow:auto}.tabs button{border:0;background:transparent;border-radius:8px;padding:10px 7px;text-align:left;font-size:9px;color:#777}.tabs button.active{background:var(--i);color:white}.tabs small{display:block;margin-bottom:3px}.body{display:grid;grid-template-columns:minmax(0,1fr) 215px}.doc{padding:26px;min-width:0}.head{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding-bottom:18px}.head small{color:var(--g)}.head h2{font:500 26px SimSun;margin:5px 0}.head p{font-size:10px;color:#888;margin:0}.primary{height:max-content;border:0;background:var(--g);color:white;border-radius:9px;padding:11px 14px;font-size:10px}.context{margin-top:13px;background:#f4f5f1;padding:9px;border-radius:8px;font-size:9px;color:#777}.context b{color:#444;margin-left:10px}#editor{min-height:450px;border:0;background:white;box-shadow:none;font:14px/1.95 SimSun;padding:22px 2px}.foot{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--l);padding-top:12px}.foot select{width:auto;max-width:230px;margin:0;padding:7px;font-size:8px}.foot button,.checkall{border:1px solid var(--l);background:white;border-radius:7px;padding:8px;font-size:9px}.inspect{border-left:1px solid var(--l);background:#fafaf7;padding:20px 15px}.score{display:flex;justify-content:space-between}.score b{font:30px Georgia;color:var(--g)}.check{display:grid;grid-template-columns:20px 1fr auto;padding:9px 0;border-bottom:1px solid #e5e4dd;font-size:9px}.check i{font-style:normal}.check i.pass{color:var(--g)}.check i.fail{color:var(--r)}.check i.pending{color:#999}.check b{font-size:8px}.check i.fail~b{color:var(--r)}.memory{margin-top:20px;padding:12px;border:1px solid var(--l);border-radius:9px;background:white;font-size:9px}.memory div{display:flex;justify-content:space-between;padding-top:10px}.checkall{width:100%;margin-top:12px;background:var(--i);color:white}.confirm-modal{position:fixed;inset:0;z-index:30;background:#0006;display:grid;place-items:center}.confirm-modal[hidden]{display:none}.confirm-modal>div{width:min(420px,90vw);background:white;border-radius:14px;padding:22px;box-shadow:0 18px 60px #0003}.confirm-modal p{font-size:13px;line-height:1.7;margin:0 0 18px}.confirm-modal footer{display:flex;justify-content:flex-end;gap:8px}.confirm-modal button{border:1px solid var(--l);border-radius:8px;padding:8px 13px;background:white}.confirm-modal button.primary{background:var(--g);color:white}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#20211e;color:white;padding:10px 16px;border-radius:99px;font-size:10px;opacity:0;transition:.2s}#toast.show{opacity:1}@media(max-width:950px){.shell{grid-template-columns:minmax(0,1fr)}.body{grid-template-columns:minmax(0,1fr)}.inspect{border-left:0}.progress{display:none}}@media(max-width:600px){.hero{padding:28px 18px}.shell{padding:0 10px}.pair{grid-template-columns:minmax(0,1fr)}.doc{padding:18px}.head{display:block}.primary{width:100%;margin-top:14px}}

</style></head><body><header class="top"><div class="brand"><b>折</b>折光故事工坊</div><div class="save">● <span id="saved">已自动保存</span>　<button id="export">导出项目</button></div></header><main><section class="hero"><div><small>AI LONG-FORM STORY ENGINE</small><h1>让每一处伏笔，<br><em>都有回声。</em></h1><p>先规划，再写作。让世界规则、人物状态和剧情因果成为可追踪的创作记忆。</p></div><div class="progress"><b id="percent">14%</b><span> 项目完成度</span><div class="bar"><i id="bar" style="width:14%"></i></div><small id="ptext">1 / 7 个模块已就绪</small></div></section><section class="shell"><aside class="panel"><h2>项目控制台 · 导演模式</h2><p class="input-note">仅题材为必填项，其他内容均可留空，由模型合理推断。</p><label>作品名 <small>可选</small><input data-f="title" value="雾港来信"></label><label>核心创意 <small>可选</small><textarea data-f="premise" rows="3">失忆的气象观测员，每逢暴雨都会收到七天后的求救信。</textarea></label><div class="pair"><label>题材 <strong>必填</strong><select data-f="genre" required><option value="">请选择题材</option><option>玄幻</option><option>奇幻</option><option>武侠</option><option>仙侠</option><option>都市</option><option>现实</option><option>军事</option><option>历史</option><option>游戏</option><option>体育</option><option>科幻</option><option>诸天无限</option><option selected>悬疑</option><option>轻小说</option><option>短篇</option></select></label><label>叙事视角<select data-f="pov"><option value="">自动推断</option><option>第三人称限知</option><option>第一人称</option><option>多视角限知</option></select></label></div><div class="pair"><label>目标篇幅<select data-f="length"><option value="">自动推断</option><option>短篇 · 1万字</option><option selected>中篇 · 3万字</option><option>长篇 · 15万字</option></select></label><label>节奏<select data-f="pace"><option value="">自动推断</option><option>紧凑推进</option><option>张弛平衡</option><option>慢热沉浸</option></select></label></div><label>文风特征<input data-f="tone" value="冷峻、短句、克制情绪、潮湿意象"></label><label>锁定设定<textarea data-f="constraints" rows="3">不模仿具体作者；无穿越；红色雨伞必须在结局回收。</textarea></label><button id="lock" class="lock" aria-pressed="true">◆ 核心设定已锁定</button><div class="output-box"><span>小说文件地址</span><a id="outputLink" href="#" target="_blank">尚未导出成稿 ↗</a><small id="linkState">保存后可访问</small></div></aside><section class="work"><nav id="tabs" class="tabs"></nav><div class="body"><article class="doc"><header class="head"><div><small id="mod">MODULE 01</small><h2 id="stitle">需求解析</h2><p id="help">区分明确要求、系统推断与待定内容</p></div><button id="gen" class="primary">生成需求解析 ↗</button></header><div class="context">上下文策略 <b id="ctx">仅使用创作简报</b></div><textarea id="editor" aria-label="当前模块内容"></textarea><footer class="foot"><button id="version">保存版本</button><select id="versionSelect" aria-label="历史版本"><option value="">选择历史版本</option></select><button id="restoreVersion" disabled>恢复版本</button><button id="branch">创建剧情分支</button></footer></article><aside class="inspect"><div class="score"><b style="font:700 11px sans-serif">创作守门员</b><b id="score">—</b></div><p style="font-size:9px;color:#888">实时检查当前模块与锁定设定。</p><div id="checks"></div><div class="memory"><b>长期记忆 · 已保存正文</b><div><span>已提取人物</span><em id="memoryCharacters">待读取</em></div><div><span>已记录事件</span><em id="plots">0 条</em></div><div><span>待回收伏笔</span><em id="memoryClues">待读取</em></div></div><button id="checkall" class="checkall">验证全部模块</button></aside></div></section></section></main><div id="confirmModal" class="confirm-modal" hidden><div role="dialog" aria-modal="true" aria-labelledby="confirmText"><p id="confirmText"></p><footer><button id="confirmCancel">取消</button><button id="confirmOk" class="primary">确认</button></footer></div></div><div id="toast"></div><script type="module" src="/studio-v2.js"></script></body></html>
