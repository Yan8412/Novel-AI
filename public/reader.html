<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>匿名章节盲评</title><style>body{margin:0;background:#f1f0eb;color:#20211e;font:15px/1.9 "Microsoft YaHei",sans-serif}main{max-width:760px;margin:40px auto;padding:30px;background:white;border-radius:16px}h1{font:32px SimSun}#excerpt{white-space:pre-wrap;padding:22px 0;border-block:1px solid #ddd}label{display:block;margin-top:16px}textarea,input,select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px}button{margin-top:22px;padding:12px 20px;border:0;border-radius:8px;background:#365d49;color:white}.note{color:#777;font-size:12px}</style></head><body><main><h1>匿名章节盲评</h1><p class="note">页面不展示作品名、作者或模型信息。请仅根据正文作答；每个链接只能提交一次。</p><article id="excerpt">正在读取匿名章节……</article><form id="reviewForm" hidden><label>读完后是否愿意继续阅读？<select id="continueReading" required><option value="true">愿意</option><option value="false">不愿意</option></select></label><label>最感兴趣的人物<input id="interestCharacter" maxlength="2000"></label><label>从哪里开始失去兴趣<textarea id="lostInterest" maxlength="2000"></textarea></label><label>哪里难以理解<textarea id="confusion" maxlength="2000"></textarea></label><label>你预测后续会发生什么<textarea id="prediction" maxlength="2000"></textarea></label><label>是否觉得像机器生成？<select id="machineLike"><option value="false">不像</option><option value="true">像</option></select></label><label>愿意继续投入多少分钟？<input id="timeCommitment" type="number" min="0" max="10000" value="10" required></label><button type="submit">提交真实盲评</button></form><p id="status"></p></main><script type="module" src="/reader.js"></script></body></html>
